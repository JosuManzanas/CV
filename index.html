<style>
  /* Tipografía de la marca JM (variable 100–900) */
  @font-face { font-family: "Adwaita Sans JM"; src: url("fuentes/AdwaitaSans-Regular.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }

  :root {
    --fuente: "Adwaita Sans JM", "Adwaita Sans", Inter, Arial, sans-serif;
    /* Paleta JM Branding */
    --azul: #202080;      /* índigo */
    --oro: #D3BC5F;       /* dorado */
    --coral: #FF4064;     /* coral */
    --papel: #FAF8F4;     /* papel */
    --texto: #23233a;
    --suave: #5a5a78;
    --linea: #dcdcec;
    --chip: #ececf6;      /* índigo muy claro */
    --chip-oro: #f6f0d9;  /* dorado muy claro */
    --chip-coral: #ffe2e8;/* coral muy claro */
    --fondo: #ebe8e0;
    /* Diseño de página (los cambia editor.html) */
    --k: 1;      /* tamaño de letra */
    --es: 1;     /* espacio entre secciones */
    --ei: 1;     /* espacio entre elementos */
    --lh: 1.42;  /* interlineado */
    --mp: 1;     /* márgenes de página */
    --al: 67mm;  /* ancho columna derecha */
    --mt: 12mm; --mr: 11mm; --mb: 10mm; --ml: 13mm;  /* márgenes de la hoja */
    --sc: 13mm;  /* separación entre columnas */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--fondo); color: var(--texto); font: 400 calc(9pt * var(--k))/var(--lh) var(--fuente); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: inherit; text-decoration: none; }

  /* ---------- barra de herramientas (no sale al imprimir) ---------- */
  .barra { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 14px 16px 0; }
  .barra button { font: 500 13px var(--fuente); border: 1px solid var(--linea); background: #fff; color: var(--azul); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .barra button:hover { border-color: var(--azul); }
  .barra button.primario { background: var(--azul); color: #fff; border-color: var(--azul); }

  /* ---------- hoja A4 ---------- */
  .hoja { width: 210mm; min-height: 297mm; margin: 14px auto 32px; background: #fff; box-shadow: 0 2px 18px rgba(20,30,60,.10);
          padding: calc(var(--mt) * var(--mp)) calc(var(--mr) * var(--mp)) calc(var(--mb) * var(--mp)) calc(var(--ml) * var(--mp)); display: grid; grid-template-columns: 1fr var(--al); column-gap: calc(var(--sc) * 6 / 13); }
  .principal { min-width: 0; font-size: calc(9.4pt * var(--k)); }
  .principal h2 { margin: calc(19px * var(--es)) 0 calc(10px * var(--ei)); }
  section[data-drag] { margin-top: var(--arriba, 0px); }
  .principal .item { padding-bottom: calc(14px * var(--ei)); }
  .lateral { border-left: 1px solid var(--linea); padding-left: calc(var(--sc) * 7 / 13); min-width: 0; }
  /* Opción: columna lateral a la izquierda */
  .hoja.lat-izq { grid-template-columns: var(--al) 1fr; }
  .hoja.lat-izq .cab-total { order: -2; }
  .hoja.lat-izq .lateral { order: -1; border-left: 0; padding-left: 0; border-right: 1px solid var(--linea); padding-right: calc(var(--sc) * 7 / 13); }

  /* cabecera */
  h1 { font: 800 calc(26pt * var(--k))/1.05 var(--fuente); color: var(--azul); letter-spacing: -1px; overflow-wrap: anywhere; }
  .titular { font-size: calc(11pt * var(--k)); color: var(--suave); margin-top: 6px; }
  .perfil { margin-top: 9px; color: var(--suave); font-size: calc(9pt * var(--k)); }

  /* títulos de sección */
  h2 { display: flex; align-items: center; gap: 10px; font: 700 calc(10.5pt * var(--k)) var(--fuente); letter-spacing: .22em; color: var(--titulo, var(--azul)); text-transform: uppercase; margin: 15px 0 8px; }
  h2::after { content: ""; flex: 1; height: 1.2px; background: var(--acento, var(--azul)); opacity: .8; }
  section[style*="--acento"] > h2::after { height: 1.6px; opacity: 1; }

  /* línea de tiempo */
  .linea-tiempo { position: relative; }
  .item { position: relative; padding-left: 20px; padding-bottom: calc(10px * var(--ei)); }
  /* la línea va de bolita a bolita, sin huecos (la bolita se pinta encima) */
  .item::before { content: ""; position: absolute; left: 4.5px; top: 9px; bottom: -9px; width: 1.2px; background: var(--oro); opacity: .55; }
  .item:last-child::before { bottom: 4px; }
  .item::after { content: ""; position: absolute; left: 0; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--azul)); }
  .lt-color .item::before { background: var(--c); opacity: .6; width: 1.6px; left: 4.2px; }
  .item.oro { --c: var(--oro); } .item.coral { --c: var(--coral); } .item.azul { --c: var(--azul); }
  .item-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .item h3 { font-size: calc(10.4pt * var(--k)); font-weight: 600; color: var(--azul); }
  .fecha { font-size: calc(8.6pt * var(--k)); color: var(--suave); white-space: nowrap; }
  .empresa { color: var(--suave); font-size: calc(9.6pt * var(--k)); margin-top: 1px; }
  .item ul { list-style: none; margin-top: 5px; }
  .item li { position: relative; padding-left: 13px; margin-top: 2px; }
  .item li::before { content: ""; position: absolute; left: 1px; top: .58em; width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
  .item p.desc { margin-top: 3px; color: var(--texto); }
  .item a.link { color: var(--azul); text-decoration: underline; text-underline-offset: 2px; }

  .item .chips li { padding: 2px 8px; margin: 0; }
  .item .chips li::before { display: none; }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; list-style: none; }
  .chips li { background: var(--chip); padding: 2px 7px; border-radius: 6px; font-size: calc(8pt * var(--k)); color: var(--texto); }
  .chips.oro li, .item.oro .chips li { background: var(--chip-oro); }
  .chips.coral li { background: var(--chip-coral); }
  .creatividad .chips { margin-top: 0; }
  .desc-sec { margin-bottom: 6px; }
  .item.coral .chips li { background: var(--chip-coral); }

  /* lateral */
  .contacto { list-style: none; }
  .contacto li { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; font-size: calc(8.8pt * var(--k)); word-break: break-word; }
  .ico { width: 15px; height: 15px; flex: none; fill: var(--oro); }
  .ico.azul { fill: var(--azul); }
  .ico.coral { fill: var(--coral); }
  .subtit { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--azul); font-size: calc(10pt * var(--k)); margin: 4px 0 2px; }
  .subtit.sep { border-top: 1px solid var(--linea); padding-top: 8px; margin-top: 8px; }
  .nota { font-size: calc(8pt * var(--k)); color: var(--suave); margin-top: 5px; line-height: 1.35; }
  .form { display: flex; gap: 9px; margin-bottom: 6px; }
  .form strong { display: block; font-size: calc(9.4pt * var(--k)); color: var(--azul); line-height: 1.3; }
  .form div > span { font-size: calc(8.5pt * var(--k)); color: var(--suave); }
  .lista { list-style: none; }
  .lista li { position: relative; padding-left: 11px; font-size: calc(8pt * var(--k)); margin-bottom: 2px; line-height: 1.32; }
  .lista li::before { content: ""; position: absolute; left: 1px; top: .5em; width: 5px; height: 5px; border-radius: 50%; background: var(--oro); }
  .idioma { margin-bottom: calc(6px * var(--ei)); }
  .idioma-cab { display: flex; justify-content: space-between; font-size: calc(9.2pt * var(--k)); }
  .idioma-cab strong { font-weight: 600; color: var(--azul); }
  .idioma-cab > span { color: var(--suave); font-size: calc(8.6pt * var(--k)); }
  .barra-nivel { height: 5px; background: var(--chip); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .barra-nivel i { display: block; height: 100%; background: var(--azul); border-radius: 3px; }
  /* columna derecha algo más compacta para que todo quepa en un A4 */
  .lateral h2 { margin: 2px 0 calc(6px * var(--ei)); }
  .lateral > section + section { margin-top: calc(10px * (var(--es) - 1) + var(--arriba, 0px)); }
  .lateral .subtit.sep { padding-top: calc(6px * var(--ei)); margin-top: calc(6px * var(--ei)); }
  .lateral .chips { gap: 3px; margin-top: 4px; }
  .lateral .chips li { padding: 1.5px 6px; }
  .lateral .lista li { margin-bottom: calc(1px * var(--ei)); }
  .lateral .form { margin-bottom: calc(4px * var(--ei)); }
  .contacto li { margin-bottom: calc(4px * var(--ei)); }
  /* QR en Contacto (a la derecha de las líneas cortas) */
  /* Cabecera a todo el ancho: nombre + contacto en fila + QR grande a la derecha */
  .cab-total { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8mm; margin-bottom: calc(3mm * var(--es)); }
  .cab-txt { min-width: 0; }
  .contacto-fila { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 9px; }
  .contacto-fila li { margin: 0 !important; }
  .qr-cab { flex: none; width: var(--qc, 24mm); display: grid; justify-items: center; gap: 2px; color: var(--azul); text-decoration: none; }
  .qr-cab svg { width: 100%; height: auto; display: block; }
  .qr-cab span { font-size: calc(6.6pt * var(--k)); letter-spacing: .06em; text-transform: uppercase; color: var(--suave); white-space: nowrap; }
  .con-cabecera .principal > header .perfil { margin-top: 0; }
  body.ats .qr-cab { display: none; }
  body.ats .cab-total { display: block; }
  /* QR como tarjeta al final de la columna derecha */
  .qr-final { display: flex; align-items: center; gap: 9px; margin-top: calc(6px * var(--es)); padding-top: calc(6px * var(--es)); border-top: 1px solid var(--linea); color: var(--azul); text-decoration: none; }
  .qr-final svg { width: var(--qf, 15mm); height: auto; flex: none; display: block; }
  .qr-final span { display: grid; gap: 1px; font-size: calc(8.2pt * var(--k)); color: var(--suave); line-height: 1.3; }
  .qr-final b { font-size: calc(10pt * var(--k)); color: var(--azul); font-weight: 700; }
  body.ats .qr-final { display: none; }
  .contacto-caja { position: relative; }
  .qr { position: absolute; top: 0; right: 0; width: var(--qr, 15mm); top: 1px; display: grid; justify-items: center; gap: 1px; color: var(--azul); text-decoration: none; }
  .qr svg { width: 100%; height: auto; display: block; }
  .qr span { font-size: calc(6.5pt * var(--k)); letter-spacing: .08em; text-transform: uppercase; color: var(--suave); white-space: nowrap; }
  body.ats .qr { display: none; }
  .solo-ats { display: none; }

  /* modo edición (editor.html) */
  body.editando .barra { display: none; }
  body.editando .hoja { margin-top: 20px; }
  body.editando [data-p] { outline: 1px dashed transparent; outline-offset: 1px; border-radius: 2px; cursor: text; transition: outline-color .15s, background .15s; }
  body.editando [data-p]:hover { outline-color: var(--oro); background: rgba(211,188,95,.12); }
  body.editando [data-p]:focus { outline: 1.5px solid var(--coral); background: #fff; }
  .chip-x, .chip-mas { display: none; }
  body.editando .chips li { position: relative; }
  body.editando .chip-x { display: none; position: absolute; top: -6px; right: -6px; width: 15px; height: 15px; border-radius: 50%; border: 0;
    background: var(--coral); color: #fff; font: 700 11px/15px var(--fuente); padding: 0; cursor: pointer; }
  body.editando .chips li:hover .chip-x { display: block; }
  body.editando .chips li.chip-mas { display: list-item; background: none; padding: 0; }
  body.editando .chip-mas button { border: 1px dashed var(--suave); background: none; color: var(--suave); border-radius: 6px; padding: 1px 8px; font: 500 calc(8pt * var(--k)) var(--fuente); cursor: pointer; }
  body.editando .chip-mas button:hover { border-color: var(--azul); color: var(--azul); }
  body.editando .chips li [data-p]:empty::before { content: "escribe…"; color: var(--suave); }
  body.midiendo .chip-mas, body.midiendo .asa-esp { display: none !important; }
  /* Indicador de A4 en el editor */
  .linea-a4 { display: none; }
  body.editando .linea-a4 { display: block; position: absolute; height: 0; border-top: 1.5px dashed rgba(32,32,128,.25); pointer-events: none; z-index: 12; }
  body.editando .linea-a4 span { position: absolute; right: 0; top: -9px; font: 600 9px/16px var(--fuente); padding: 0 6px; border-radius: 8px; background: #ececf6; color: var(--azul); }
  body.editando .linea-a4.alerta { border-top-color: var(--coral); }
  body.editando .linea-a4.alerta span { background: var(--coral); color: #fff; }
  body.editando :is(.qr, .qr-cab, .qr-final) svg { cursor: pointer; }
  body.editando .no-cabe { outline: 1.5px solid rgba(255,64,100,.7) !important; outline-offset: 1px; background: rgba(255,64,100,.10) !important; border-radius: 3px; }
  @media print { .linea-a4 { display: none !important; } body.editando .no-cabe { outline: 0 !important; background: none !important; } }
  body.editando section[data-drag] > h2 { cursor: grab; }
  body.editando section[data-drag] { position: relative; }
  .asa-esp { display: none; }
  body.editando .asa-esp { position: absolute; z-index: 15; top: -11px; left: 50%; transform: translateX(-50%); height: 16px; min-width: 26px; padding: 0 6px;
    border-radius: 8px; background: var(--coral); color: #fff; font: 700 10px/16px var(--fuente); text-align: center; cursor: ns-resize; box-shadow: 0 1px 4px rgba(0,0,0,.2); white-space: nowrap; }
  body.editando section[data-drag]:hover > .asa-esp, body.editando .asa-esp.activa { display: block; }
  body.moviendo .asa-esp:not(.activa) { display: none !important; }
  @media print { .asa-esp { display: none !important; } }
  body.editando .item:hover, body.editando .form:hover, body.editando .idioma:hover { outline: 1px dashed rgba(32,32,128,.22); outline-offset: 3px; border-radius: 4px; }
  body.editando .arrastrando { opacity: .35; }
  body.moviendo, body.moviendo * { cursor: grabbing !important; user-select: none !important; }
  .marca-soltar { position: absolute; display: none; background: var(--coral); border-radius: 2px; pointer-events: none; z-index: 20; box-shadow: 0 0 0 3px rgba(255,64,100,.2); }
  @media print { .marca-soltar { display: none !important; } }
  @media print { body.editando .chip-x, body.editando .chip-mas { display: none !important; } }
  @media print { body.editando [data-p] { outline: 0 !important; background: none !important; } }

  /* ---------- MODO ATS: una columna, sin adornos, texto lineal ---------- */
  body.ats .hoja { display: block; padding: 14mm 16mm; }
  body.ats .lateral, body.ats .hoja.lat-izq .lateral { border: 0; padding: 0; }
  body.ats h1 { font: 700 calc(22pt * var(--k)) var(--fuente); letter-spacing: 0; }
  body.ats h2 { letter-spacing: .06em; font-size: calc(11pt * var(--k)); margin: 14px 0 6px; }
  body.ats .lateral h2 { margin-top: 14px; }
  body.ats .lateral > section + section, body.ats section[data-drag] { margin-top: 0 !important; }
  body.ats .item { padding-left: 0; padding-bottom: 8px; }
  body.ats .principal h2 { margin: 14px 0 6px; }
  body.ats .item::before, body.ats .item::after { display: none; }
  body.ats .item li { padding-left: 12px; }
  body.ats .item li::before { content: "•"; background: none; width: auto; height: auto; top: 0; left: 0; color: var(--texto); }
  body.ats .chips, body.ats .ico, body.ats .barra-nivel { display: none; }
  body.ats .solo-ats { display: block; }
  body.ats .sec-contacto { display: none; }
  body.ats .contacto-ats { margin-top: 4px; font-size: calc(9.4pt * var(--k)); }
  body.ats .lateral > section:nth-child(2) h2 { margin-top: 14px; }
  body.ats .contacto { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  body.ats .contacto li { margin: 0; }
  body.ats .form { display: block; }
  body.ats .lista li::before { content: "•"; background: none; width: auto; height: auto; top: 0; color: var(--texto); }
  body.ats .subtit.sep { border: 0; padding-top: 0; margin-top: 6px; }
  body.ats .idioma { display: none; }
  /* ATS: una columna en una sola hoja (letra algo más compacta, mínimo ~8 pt) */
  body.ats { --k: .93; --lh: 1.3; }
  body.ats .lista li, body.ats .nota, body.ats .solo-ats { font-size: 8.6pt; }
  body.ats [data-id="idiomas"] .lista { display: inline; margin: 0 !important; }
  body.ats [data-id="idiomas"] .lista li { display: inline; padding: 0; }
  body.ats [data-id="idiomas"] .lista li::before { content: " · "; position: static; }
  body.ats [data-id="idiomas"] .solo-ats { display: inline; }
  body.ats h2 { margin: 9px 0 3px !important; }
  body.ats .item { padding-bottom: 5px; }
  body.ats .item ul { margin-top: 2px; }
  body.ats .item li { margin-top: 0; }
  body.ats .perfil { margin-top: 5px; }
  body.ats .subtit { margin: 4px 0 0; }

  /* ---------- pantalla estrecha (móvil) ---------- */
  @media screen and (max-width: 820px) {
    body:not(.web) .hoja { width: auto; min-height: 0; margin: 12px 16px 24px; padding: 22px 18px; display: block; }
    body:not(.web) .lateral { border-left: 0; padding-left: 0; border-right: 0; padding-right: 0; }
    body:not(.web) h1 { font-size: calc(26pt * var(--k)); white-space: normal; }
    body:not(.web) .item-cab { flex-direction: column; gap: 0; }
  }

  /* ---------- VISTA WEB: la misma hoja A4 que en el editor, con esquinas redondeadas ---------- */
  @media screen {
    body.web .hoja { border-radius: 14px; }
    body.web .pie { display: block; text-align: center; color: var(--suave); font-size: 12px; padding: 0 16px 28px; }
  }
  .pie { display: none; }

  /* ---------- impresión / PDF ---------- */
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .barra { display: none; }
    .hoja { margin: 0; box-shadow: none; width: 210mm; height: 297mm; min-height: 0; overflow: hidden; display: grid; padding: calc(var(--mt) * var(--mp)) calc(var(--mr) * var(--mp)) calc(var(--mb) * var(--mp)) calc(var(--ml) * var(--mp)); }
    body.ats .hoja { display: block; height: auto; overflow: visible; padding: 14mm 16mm; }
    .lateral { border-left: 1px solid var(--linea); padding-left: calc(var(--sc) * 7 / 13); }
    .hoja.lat-izq .lateral { border-left: 0; padding-left: 0; border-right: 1px solid var(--linea); padding-right: calc(var(--sc) * 7 / 13); }
    body.ats .lateral, body.ats .hoja.lat-izq .lateral { border: 0; padding: 0; }
    .item, .form, .idioma { break-inside: avoid; }
    /* El PDF visual es siempre UNA hoja A4: nada del editor debe empujar el contenido */
    html, body { margin: 0 !important; padding: 0 !important; }
    body:not(.ats) { width: 210mm; height: 297mm; overflow: hidden; }
    body.editando .hoja { margin: 0 !important; }
    .marca-soltar, .asa-esp, .chip-mas, .chip-x, noscript { display: none !important; }
    .hoja { zoom: 1 !important; border-radius: 0 !important; }
    .pie { display: none !important; }
    body.ats .hoja { padding: 7mm 13mm 5mm; }
  }
</style>

    mail:  '<path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h17A1.5 1.5 0 0 1 22 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18.5zm2.2.5L12 11.6 19.8 6zM20 8.2l-8 5.7-8-5.7V18h16z"/>',

    pin:   '<path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7m0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5"/>',
    in:    '<path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1m3.3 15.3V9.8H4.7v8.5zM6 8.6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3m12.3 9.7v-4.7c0-2.3-.5-4-3.2-4a2.8 2.8 0 0 0-2.5 1.4V9.8h-2.5v8.5h2.6v-4.2c0-1.1.2-2.2 1.6-2.2s1.4 1.3 1.4 2.3v4.1z"/>',
    gh:    '<path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2"/>',
    web:   '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20m6.9 6h-2.95a15.6 15.6 0 0 0-1.38-3.56A8 8 0 0 1 18.9 8M12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82A13.8 13.8 0 0 1 12 4.04M4.26 14a8.2 8.2 0 0 1 0-4h3.38a16.5 16.5 0 0 0 0 4zm.82 2h2.95a15.6 15.6 0 0 0 1.38 3.56A8 8 0 0 1 5.08 16M8.03 8H5.08a8 8 0 0 1 4.33-3.56A15.6 15.6 0 0 0 8.03 8M12 19.96A13.8 13.8 0 0 1 10.09 16h3.82A13.8 13.8 0 0 1 12 19.96M14.34 14H9.66a14.7 14.7 0 0 1 0-4h4.68a14.7 14.7 0 0 1 0 4m.25 5.56A15.6 15.6 0 0 0 15.97 16h2.95a8 8 0 0 1-4.33 3.56M16.36 14a16.5 16.5 0 0 0 0-4h3.38a8.2 8.2 0 0 1 0 4z"/>',
    gear:  '<path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7"/>',
    team:  '<path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8m7 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6M9 13c-3.3 0-7 1.6-7 4v3h14v-3c0-2.4-3.7-4-7-4m7 0c-.4 0-.8 0-1.2.1 1.3.9 2.2 2.2 2.2 3.9v3h5v-3c0-2.2-3.4-4-6-4"/>',
    cap:   '<path d="M12 3 1 9l11 6 9-4.9V17h2V9zM5 13.2v4L12 21l7-3.8v-4L12 17z"/>',
    ia:    '<path d="M10 2.5l1.6 4.4L16 8.5l-4.4 1.6L10 14.5l-1.6-4.4L4 8.5l4.4-1.6zM18 12l.9 2.4 2.4.9-2.4.9L18 18.6l-.9-2.4-2.4-.9 2.4-.9zM6.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
    chat:  '<path d="M12 3C6.5 3 2 6.9 2 11.6c0 2.4 1.2 4.6 3.1 6.1L4 21l4-1.9c1.2.4 2.6.6 4 .6 5.5 0 10-3.9 10-8.6S17.5 3 12 3m0 15.2c-1.3 0-2.5-.2-3.6-.6l-.6-.2-1.7.8.5-1.5-.6-.5C4.4 15 3.6 13.4 3.6 11.6 3.6 7.8 7.4 4.7 12 4.7s8.4 3.1 8.4 6.9-3.8 6.6-8.4 6.6"/>'
  };
  const ico = (n, cls = "") => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const chips = (arr, cls = "", p = "") => `<ul class="chips ${cls}">${arr.map((t, i) => `<li${p ? ` data-drag data-grupo="${p}" data-i="${i}"` : ""}>${p ? ed(`${p}.${i}`, t) +
      `<button class="chip-x" data-borrar="${p}.${i}" title="Quitar">×</button>` : esc(t)}</li>`).join("")}${
      p ? `<li class="chip-mas"><button data-anadir="${p}" title="Añadir etiqueta">+ Añadir</button></li>` : ""}</ul>
                                    <p class="solo-ats">${arr.map(esc).join(", ")}.</p>`;
  // Solo enlaces http(s): cualquier otra cosa (javascript:, data:…) se trata como texto de una web
  const url = s => (/^https?:\/\//i.test(s) ? s : "https://" + String(s).replace(/^[a-z][a-z0-9+.-]*:\/*/i, ""));
  // Código QR en SVG (librería qrcode-generator; si no carga, simplemente no se muestra)
  function qrSVG(texto) {
    if (!window.qrcode || !texto) return "";
    qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
    const q = qrcode(0, "M"); q.addData(texto, "Byte"); q.make();
    const n = q.getModuleCount();
    const ojo = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
    // Puntos redondos en índigo + esquinas redondeadas con el centro en coral (marca JM)
    let puntos = "";
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
      if (q.isDark(y, x) && !ojo(x, y)) puntos += n > 25 ? `<rect x="${x}" y="${y}" width="1.02" height="1.02" rx=".18"/>` : `<circle cx="${x + .5}" cy="${y + .5}" r=".46"/>`;
    const esquina = (x, y) => `<rect x="${x + .5}" y="${y + .5}" width="6" height="6" rx="1.8" style="fill:none;stroke:var(--azul);stroke-width:1"/>
      <rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx=".9" style="fill:var(--coral)"/>`;
    return `<svg viewBox="-1.5 -1.5 ${n + 3} ${n + 3}" aria-label="Código QR"><rect x="-1.5" y="-1.5" width="${n + 3}" height="${n + 3}" rx="2" fill="#fff"/>
      <g style="fill:var(--azul)">${puntos}</g>${esquina(0, 0)}${esquina(n - 7, 0)}${esquina(0, n - 7)}</svg>`;
  }
  // Texto editable desde editor.html (data-p = ruta del dato)
  const ed = (p, v) => `<span data-p="${p}">${esc(v ?? "")}</span>`;

  // Ajustes de diseño (editables desde editor.html → "Diseño de página")
  const ESTILO = { k: 1, es: 1, ei: 1, lh: 1.42, mp: 1, al: 67, mt: 12, mr: 11, mb: 10, ml: 13, sc: 13, qr: 15, qc: 24, qf: 15 };
  const EN_MM = ["al", "mt", "mr", "mb", "ml", "sc", "qr", "qc", "qf"];
  // Orden por defecto de las secciones en cada columna
  const ORDEN = { principal: ["experiencia", "proyectos", "creatividad"], lateral: ["contacto", "competencias", "formacion", "idiomas"] };

  function render(cv) {
    if (!cv || typeof cv !== "object" || !cv.contacto) return;
    const c = cv.contacto;
    const raiz = document.documentElement.style;
    const col = cv.colores || {};
    ["azul", "oro", "coral"].forEach(k => col[k] ? raiz.setProperty("--" + k, col[k]) : raiz.removeProperty("--" + k));
    const est = cv.estilo || {};
    Object.entries(ESTILO).forEach(([k, d]) => raiz.setProperty("--" + k, (est[k] ?? d) + (EN_MM.includes(k) ? "mm" : "")));
    raiz.setProperty("--k0", est.k ?? 1);   // tamaño base para el modo web

    const arr = (g, i) => `data-drag data-grupo="${g}" data-i="${i}"`;
    const qr = cv.qr || {};
    const posQR = qr.posicion || "final";   // "final" (tarjeta al final) · "contacto" · "cabecera"
    // QR: "vcard" = tarjeta de contacto (guardar / llamar) · "enlace" = abre una web
    const tel = (c.telefono || "").replace(/\s/g, "");
    // Contacto en vCard 3.0 estándar (saltos de línea CRLF, como exige el formato): Google Lens y las cámaras lo reconocen
    const vc = t => String(t).replace(/([\\;,])/g, "\\$1");
    // Nombre y apellidos por separado (los datos antiguos con "Nombre Apellido" en nombre siguen funcionando)
    const nom = String(cv.nombre || "").split(" ");
    const pila = cv.apellido1 != null ? cv.nombre : nom[0];
    const apellidos = [cv.apellido1 != null ? cv.apellido1 : nom.slice(1).join(" "), cv.apellido2].filter(Boolean).join(" ");
    const nombreCompleto = [cv.nombre, cv.apellido1, cv.apellido2].filter(Boolean).join(" ");
    const vcard = ["BEGIN:VCARD", "VERSION:3.0", `N:${vc(apellidos)};${vc(pila)};;;`, `FN:${vc(nombreCompleto)}`,
      tel && `TEL;TYPE=CELL:${/^\d{9}$/.test(tel) ? "+34" + tel : tel}`, c.email && `EMAIL:${c.email.toLowerCase()}`, "END:VCARD"].filter(Boolean).join("\r\n");
    const telInt = /^\d{9}$/.test(tel) ? "+34" + tel : tel;
    const QR_TIPOS = {
      llamar: tel && telInt,   // solo el número: algunas apps convierten "tel:" en dígitos del teclado (835…)
      whatsapp: tel && "https://wa.me/" + telInt.replace(/\D/g, ""),
      vcard,
      enlace: qr.url || (c.web ? url(c.web) : "")
    };
    const qrUrl = qr.mostrar === false ? "" : (QR_TIPOS[qr.tipo || "llamar"] || "");
    const qrHtml = qrUrl ? qrSVG(qrUrl) : "";
    // Clic en el QR = lo mismo que escanearlo (con vCard descarga la tarjeta de contacto .vcf)
    const qrHref = qr.tipo === "vcard" ? "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard) : qrUrl;
    // En el editor el QR no es un enlace: un clic abre sus opciones en el panel
    const editando = new URLSearchParams(location.search).has("editar");
    const qrDescarga = editando ? "" : qr.tipo === "vcard" ? ` download="${esc(nombreCompleto)}.vcf"` : "";
    const enCab = posQR === "cabecera";   // opcional: QR grande arriba a la derecha
    const qrTexto = { llamar: "Llámame", whatsapp: "Escríbeme por WhatsApp", vcard: "Guarda mi contacto", enlace: "Mi CV online" }[qr.tipo || "llamar"];
    const qrTitulo = { llamar: "Escanéame para llamarme", whatsapp: "Escanéame para escribirme por WhatsApp", vcard: "Escanéame para guardar mi contacto", enlace: "Escanéame: " + qrUrl }[qr.tipo || "llamar"];
    const lineas = {
      email:     c.email     && `<li>${ico("mail")}<a href="mailto:${esc(c.email)}">${ed("contacto.email", c.email)}</a></li>`,
      telefono:  c.telefono  && `<li>${ico("tel")}<a href="tel:${esc(c.telefono.replace(/\s/g, ""))}">${ed("contacto.telefono", c.telefono)}</a></li>`,
      ubicacion: c.ubicacion && `<li>${ico("pin")}${ed("contacto.ubicacion", c.ubicacion)}</li>`,
      linkedin:  c.linkedin  && `<li>${ico("in", "azul")}<a href="${esc(url(c.linkedin))}" rel="noopener">${ed("contacto.linkedin", c.linkedin)}</a></li>`,
      github:    c.github    && `<li>${ico("gh", "azul")}<a href="${esc(url(c.github))}" rel="noopener">${ed("contacto.github", c.github)}</a></li>`,
      web:       c.web       && `<li>${ico("web", "azul")}<a href="${esc(url(c.web))}" rel="noopener">${ed("contacto.web", c.web)}</a></li>`
    };
    // Con el QR dentro de Contacto, las líneas cortas van primero para dejarle hueco
    const contacto = (posQR === "contacto" ? ["telefono", "ubicacion", "web", "email", "linkedin", "github"] : ["email", "telefono", "ubicacion", "linkedin", "github", "web"])
      .map(k => lineas[k]).filter(Boolean).join("");

    const experiencia = cv.experiencia.map((e, n) => `
      <article class="item ${e.color}" ${arr("experiencia", n)}>
        <div class="item-cab"><h3>${ed(`experiencia.${n}.puesto`, e.puesto)}</h3><span class="fecha">${ed(`experiencia.${n}.fechas`, e.fechas)}</span></div>
        <div class="empresa">${ed(`experiencia.${n}.empresa`, e.empresa)} · ${ed(`experiencia.${n}.lugar`, e.lugar)}</div>
        <ul>${e.puntos.map((p, j) => `<li ${arr(`experiencia.${n}.puntos`, j)}>${ed(`experiencia.${n}.puntos.${j}`, p)}</li>`).join("")}</ul>
      </article>`).join("");

    const proyectos = cv.proyectos.map((p, n) => `
      <article class="item ${p.color}" ${arr("proyectos", n)}>
        <div class="item-cab"><h3>${ed(`proyectos.${n}.nombre`, p.nombre)}</h3><span class="fecha">${ed(`proyectos.${n}.fecha`, p.fecha)}</span></div>
        <p class="desc">${ed(`proyectos.${n}.descripcion`, p.descripcion)}${p.enlace ? ` <a class="link" href="${esc(url(p.enlace))}" rel="noopener">${esc(p.enlace.replace(/^https?:\/\//, ""))}</a>` : ""}</p>
        ${chips(p.etiquetas, "", `proyectos.${n}.etiquetas`)}
      </article>`).join("");

    const k = cv.competencias;
    const formacion = cv.formacion.map((f, n) => `
      <div class="form" ${arr("formacion", n)}>${ico("cap", "azul")}<div><strong>${ed(`formacion.${n}.titulo`, f.titulo)}</strong><span>${[f.centro, f.fechas].filter(Boolean).map(esc).join(" · ")}</span></div></div>`).join("");

    const idiomas = cv.idiomas.map((i, n) => `
      <div class="idioma" ${arr("idiomas", n)}>
        <div class="idioma-cab"><strong>${ed(`idiomas.${n}.idioma`, i.idioma)}</strong>${ed(`idiomas.${n}.nivel`, i.nivel)}</div>
        <div class="barra-nivel"><i style="width:${Math.max(0, Math.min(100, +i.porcentaje || 0))}%"></i></div>
      </div>`).join("");

    const lista = (g, xs, extra = "") => `<ul class="lista"${extra}>${xs.map((x, j) => `<li ${arr(g, j)}>${ed(`${g}.${j}`, x)}</li>`).join("")}</ul>`;
    // Espacio por sección: "arriba" (px extra encima) e "interno" (multiplica el espacio entre sus elementos)
    const sec = (id, html, cls = "") => {
      const ps = (est.secciones || {})[id] || {};
      const st = `--arriba:${ps.arriba || 0}px;` + (ps.interno != null ? `--ei:${(est.ei ?? 1) * ps.interno};` : "") +
        (colorSec[id] ? `--acento: var(--${colorSec[id]});` : "") +
        (colorTit(id) ? `--titulo: var(--${colorTit(id)});` : "");
      return `<section class="${cls}" data-drag="sec" data-id="${id}" style="${st}">${html}</section>`;
    };

    const SECCIONES = {
      experiencia: () => !cv.experiencia?.length ? "" : sec("experiencia", `<h2>Experiencia</h2><div class="linea-tiempo">${experiencia}</div>`),
      proyectos: () => !cv.proyectos?.length ? "" : sec("proyectos", `<h2>Proyectos</h2><div class="linea-tiempo">${proyectos}</div>`),
      creatividad: () => cv.creatividad?.items?.length ? sec("creatividad", `<h2>${ed("creatividad.titulo", cv.creatividad.titulo || "Diseño y multimedia")}</h2>
          ${cv.creatividad.texto ? `<p class="desc-sec">${ed("creatividad.texto", cv.creatividad.texto)}</p>` : ""}
          ${chips(cv.creatividad.items, "azul", "creatividad.items")}`, "creatividad") : "",
      contacto: () => enCab ? "" : sec("contacto", `<h2>Contacto</h2><div class="contacto-caja">${qrHtml && posQR === "contacto" ? `<a class="qr" ${editando ? 'role="button" draggable="false"' : `href="${esc(qrHref)}"`}${qrDescarga} title="${esc(qrTitulo)}">${qrHtml}</a>` : ""}<ul class="contacto">${contacto}</ul></div>`, "sec-contacto"),
      competencias: () => sec("competencias", `
          <h2>Competencias</h2>
          <div class="subtit">${ico("gear", "azul")}Técnicas</div>
          ${chips(k.tecnicas, "", "competencias.tecnicas")}
          ${k.nociones ? `<p class="nota">${ed("competencias.nociones", k.nociones)}</p>` : ""}
          ${k.ia?.length ? `<div class="subtit sep">${ico("ia", "coral")}${ed("competencias.iaTitulo", k.iaTitulo || "IA y agentes")}</div>${chips(k.ia, "coral", "competencias.ia")}` : ""}
          <div class="subtit sep">${ico("team")}Transversales</div>
          ${chips(k.transversales, "oro", "competencias.transversales")}`),
      formacion: () => sec("formacion", `
          <h2>Formación</h2>
          ${formacion}
          <div class="subtit" style="margin-top:8px">Cursos complementarios</div>
          ${lista("cursos", cv.cursos)}`),
      idiomas: () => sec("idiomas", `
          <h2>Idiomas</h2>
          ${idiomas}
          <p class="solo-ats">${cv.idiomas.map(i => `${esc(i.idioma)}: ${esc(i.nivel)}`).join(" · ")}</p>
          ${cv.otros.length ? lista("otros", cv.otros, ' style="margin-top:6px"') : ""}`)
    };

    const colorSec = {};
    // Color del nombre de la sección: por sección > general ("linea" = el mismo que su línea)
    const colorTit = id => {
      const v = (est.secciones || {})[id]?.colorTitulo || est.tituloColor || "";
      return v === "linea" ? colorSec[id] || "" : v;
    };
    // Orden guardado (o el de por defecto); cualquier sección nueva se añade a su columna
    const o = est.orden || {};
    const izq = (o.principal || ORDEN.principal).filter(id => SECCIONES[id]);
    const der = (o.lateral || ORDEN.lateral).filter(id => SECCIONES[id] && !izq.includes(id));
    Object.keys(SECCIONES).forEach(id => { if (!izq.includes(id) && !der.includes(id)) (ORDEN.principal.includes(id) ? izq : der).push(id); });

    // Línea de los títulos: "alterna" va rotando los colores de la marca en cada columna; cada sección puede fijar el suyo
    const ciclo = ["azul", "coral", "oro"];
    [izq, der].forEach(columna => columna.filter(id => id !== "creatividad" || cv.creatividad?.items?.length).forEach((id, i) => {
      colorSec[id] = (est.secciones || {})[id]?.color || (est.lineaSecciones === "alterna" ? ciclo[i % 3] : "");
    }));

    const hoja = document.getElementById("cv");
    hoja.classList.toggle("lt-color", est.lineaTiempo === "color");
    hoja.classList.toggle("lat-izq", est.lateral === "izquierda");
    const nombreHtml = `<h1>${ed("nombre", cv.nombre)}${cv.apellido1 ? " " + ed("apellido1", cv.apellido1) : ""}${cv.apellido2 ? " " + ed("apellido2", cv.apellido2) : ""}</h1>
          <p class="titular">${ed("titular", cv.titular)}</p>`;
    hoja.classList.toggle("con-cabecera", enCab);
    hoja.innerHTML = `
      ${enCab ? `<header class="cab-total">
        <div class="cab-txt">${nombreHtml}<ul class="contacto contacto-fila">${contacto}</ul></div>
        ${qrHtml ? `<a class="qr-cab" ${editando ? 'role="button" draggable="false"' : `href="${esc(qrHref)}"`}${qrDescarga} title="${esc(qrTitulo)}">${qrHtml}<span>${esc(qrTexto)}</span></a>` : ""}
      </header>` : ""}
      <div class="principal" data-col="principal">
        <header>
          ${enCab ? "" : `${nombreHtml}
          <p class="solo-ats contacto-ats">${[c.email, c.telefono, c.ubicacion, c.linkedin, c.github, c.web].filter(Boolean).map(esc).join(" · ")}</p>`}
          <p class="perfil">${ed("perfil", cv.perfil)}</p>
        </header>
        ${izq.map(id => SECCIONES[id]()).join("")}
      </div>
      <aside class="lateral" data-col="lateral">${der.map(id => SECCIONES[id]()).join("")}${qrHtml && posQR === "final" ? `
        <a class="qr-final" ${editando ? 'role="button" draggable="false"' : `href="${esc(qrHref)}"`}${qrDescarga} title="${esc(qrTitulo)}">${qrHtml}<span><b>${ed("qr.titulo", qr.titulo || "¿Hablamos?")}</b>${ed("qr.texto", qr.texto || qrTexto)}</span></a>` : ""}</aside>`;
  }

  function alternarATS() {
    const on = document.body.classList.toggle("ats");
    document.body.classList.toggle("web", !on && !document.body.classList.contains("editando"));
    if (typeof ajustarHoja === "function") ajustarHoja();
    document.getElementById("btn-ats").textContent = on ? "Ver versión visual" : "Ver versión ATS";
    try { history.replaceState(null, "", on ? "?ats" : location.pathname); } catch (e) {}
  }

  if (!new URLSearchParams(location.search).has("editar")) render(window.CV);
  // En pantalla se ve como página web; al imprimir sigue siendo el A4 de siempre (el editor usa la vista A4)
  const _q = new URLSearchParams(location.search);
  if (!_q.has("editar") && !_q.has("ats")) document.body.classList.add("web");
  document.getElementById("anio").textContent = new Date().getFullYear();
  // En pantallas más estrechas que el A4, la hoja se reduce entera (se ve igual que en el editor)
  function ajustarHoja() {
    const h = document.getElementById("cv");
    h.style.zoom = "";
    if (!document.body.classList.contains("web")) return;
    const z = Math.min(1, (document.documentElement.clientWidth - 16) / h.offsetWidth);
    if (z < 1) h.style.zoom = z.toFixed(4);
  }
  ajustarHoja();
  addEventListener("resize", ajustarHoja);
  document.fonts?.ready.then(ajustarHoja);
  if (new URLSearchParams(location.search).has("ats")) alternarATS();

  /* ---- Modo edición: lo usa editor.html (?editar) ---- */
  if (new URLSearchParams(location.search).has("editar")) {
    // Seguridad: los mensajes solo van a / vienen de la ventana que contiene esta vista (el editor)
    const ORIGEN = location.protocol === "file:" ? "*" : location.origin;
    const _post = parent.postMessage.bind(parent);
    const parentMsg = m => { if (parent !== window) _post(m, ORIGEN); };
    document.body.classList.add("editando");
    // Mide como quedará impreso (sin los botones del editor) y marca en rojo lo que no cabe en el A4
    const lineaA4 = Object.assign(document.createElement("div"), { className: "linea-a4", innerHTML: "<span>Fin del A4</span>" });
    document.body.appendChild(lineaA4);
    // En el "medidor" invisible del editor no se pinta nada, así que se mide sin esperar al siguiente fotograma
    const siguiente = new URLSearchParams(location.search).has("medir") ? f => setTimeout(f, 0) : requestAnimationFrame;
    const informar = () => siguiente(() => {
      document.body.classList.add("midiendo");
      document.querySelectorAll(".no-cabe").forEach(el => el.classList.remove("no-cabe"));
      const hoja = document.querySelector(".hoja"), rh = hoja.getBoundingClientRect();
      const limite = rh.top + 1122.5 - parseFloat(getComputedStyle(hoja).paddingBottom);
      const izq = document.querySelector(".hoja").classList.contains("lat-izq");
      const columnas = [[izq ? "derecha" : "izquierda", ".principal"], [izq ? "izquierda" : "derecha", ".lateral"]].map(([nombre, sel]) => {
        const col = document.querySelector(sel); if (!col) return null;
        const fondo = Math.max(...[...col.children].map(e => e.getBoundingClientRect().bottom), col.getBoundingClientRect().top);
        const px = Math.ceil(fondo - limite);
        if (px > 0) col.querySelectorAll(".item, .form, .idioma, li, h2, h3, p, .subtit, .qr-final, .chips, header")
          .forEach(e => { if (e.getBoundingClientRect().bottom > limite + 1) e.classList.add("no-cabe"); });
        return px > 0 ? { columna: nombre, px } : null;
      }).filter(Boolean);
      document.body.classList.remove("midiendo");
      Object.assign(lineaA4.style, { top: limite + scrollY + "px", left: rh.left + scrollX + "px", width: rh.width + "px" });
      lineaA4.classList.toggle("alerta", columnas.length > 0);
      parentMsg({ tipo: "altura", h: document.documentElement.scrollHeight, desborda: columnas.length > 0, columnas, lineaY: limite + scrollY, id: window._idMedida });
    });
    const activar = () => {
      document.querySelectorAll("[data-p]").forEach(el => el.contentEditable = "plaintext-only");
      document.querySelectorAll("section[data-drag]").forEach(sec => sec.insertAdjacentHTML("afterbegin", '<div class="asa-esp" title="Arrastra arriba/abajo para cambiar el espacio encima de esta sección">↕</div>'));
      informar();
    };
    activar();
    document.fonts.ready.then(informar);
    document.addEventListener("click", e => {
      if (e.target.closest("a")) e.preventDefault();
      const b = e.target.closest("[data-borrar],[data-anadir]");
      if (b) { e.preventDefault(); parentMsg(b.dataset.borrar ? { tipo: "borrar", p: b.dataset.borrar } : { tipo: "anadir", p: b.dataset.anadir }); }
    });
    // Etiqueta vaciada = se quita
    document.addEventListener("focusout", e => {
      const el = e.target.closest(".chips [data-p]");
      if (el && !el.textContent.trim()) parentMsg({ tipo: "borrar", p: el.dataset.p });
    });
    document.addEventListener("input", e => {
      const el = e.target.closest("[data-p]");
      if (el) { parentMsg({ tipo: "editar", p: el.dataset.p, valor: el.textContent }); informar(); }
    });
    document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest("[data-p]")) { e.preventDefault(); e.target.blur(); } });
    /* ---- Arrastrar y soltar: secciones, experiencias, proyectos, tareas, chips, cursos… ---- */
    const marca = Object.assign(document.createElement("div"), { className: "marca-soltar" });
    document.body.appendChild(marca);
    let arrastre = null;
    const rect = el => el.getBoundingClientRect();
    const pinta = (x, y, w, h) => Object.assign(marca.style, { display: "block", left: x + scrollX + "px", top: y + scrollY + "px", width: w + "px", height: h + "px" });

    function destino(e) {
      const el = arrastre.el, x = e.clientX, y = e.clientY;
      if (el.dataset.drag === "sec") {
        const cols = [...document.querySelectorAll("[data-col]")];
        const col = cols.find(c => { const r = rect(c); return x >= r.left - 20 && x <= r.right + 20; }) || cols[0];
        const hermanas = [...col.querySelectorAll(":scope > section[data-drag=sec]")].filter(s => s !== el);
        const antes = hermanas.find(s => { const r = rect(s); return y < r.top + r.height / 2; });
        const rc = rect(col), ref = antes ? rect(antes) : (hermanas.length ? rect(hermanas.at(-1)) : null);
        const ly = antes ? ref.top - 6 : ref ? ref.bottom + 3 : rc.top + 120;
        pinta(rc.left, ly, rc.width, 3);
        return { tipo: "seccion", col, antes };
      }
      const g = el.dataset.grupo;
      const todos = [...document.querySelectorAll(`[data-drag][data-grupo="${CSS.escape(g)}"]`)];
      const enFila = !!el.closest(".chips");
      let pos = todos.length;
      if (enFila) {
        let mejor = null, dist = Infinity;
        todos.forEach((t, i) => { const r = rect(t); const d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2)); if (d < dist) { dist = d; mejor = i; } });
        const r = rect(todos[mejor]);
        pos = x < r.left + r.width / 2 ? mejor : mejor + 1;
        const lx = pos < todos.length && pos === mejor ? r.left - 3 : r.right + 1;
        pinta(lx, r.top - 1, 3, r.height + 2);
      } else {
        const i = todos.findIndex(t => { const r = rect(t); return y < r.top + r.height / 2; });
        pos = i < 0 ? todos.length : i;
        const ref = rect(todos[Math.min(pos, todos.length - 1)]);
        pinta(ref.left, pos < todos.length ? ref.top - 3 : ref.bottom + 1, ref.width, 3);
      }
      const de = +el.dataset.i, a = pos > de ? pos - 1 : pos;
      return { tipo: "mover", grupo: g, de, a };
    }

    // Tirador ↕: cambia el espacio encima de una sección
    let asa = null;
    document.addEventListener("pointerdown", e => {
      const h = e.target.closest(".asa-esp"); if (!h || e.button !== 0) return;
      e.preventDefault(); e.stopImmediatePropagation();
      const sec = h.parentElement;
      asa = { h, sec, y: e.clientY, base: parseFloat(sec.style.getPropertyValue("--arriba")) || 0 };
      h.classList.add("activa"); document.body.classList.add("moviendo");
    }, true);
    document.addEventListener("pointermove", e => {
      if (!asa) return;
      asa.valor = Math.round(Math.max(-12, Math.min(80, asa.base + e.clientY - asa.y)));
      asa.sec.style.setProperty("--arriba", asa.valor + "px");
      asa.h.textContent = (asa.valor > 0 ? "+" : "") + asa.valor + " px";
      getSelection().removeAllRanges();
    });
    addEventListener("pointerup", () => {
      if (!asa) return;
      const { h, sec, valor } = asa; asa = null;
      h.classList.remove("activa"); h.textContent = "↕"; document.body.classList.remove("moviendo");
      if (valor != null) parentMsg({ tipo: "espacio", id: sec.dataset.id, arriba: valor });
      informar();
    });
    // Clic en el QR (no en sus textos): abre sus opciones en el panel
    document.addEventListener("click", e => {
      const q = e.target.closest(".qr, .qr-cab, .qr-final");
      if (q && !e.target.closest("[data-p]")) { e.preventDefault(); parentMsg({ tipo: "verQR" }); }
    });
    // Clic en el título de una sección: la abre en el panel
    document.addEventListener("click", e => {
      const h2 = e.target.closest("section[data-drag] > h2");
      if (h2 && !document.body.classList.contains("moviendo")) parentMsg({ tipo: "verSeccion", id: h2.parentElement.dataset.id });
    });

    document.addEventListener("pointerdown", e => {
      if (e.button !== 0 || e.target.closest("button")) return;
      const el = e.target.closest("[data-drag]");
      if (el) arrastre = { el, x: e.clientX, y: e.clientY, activo: false };
    });
    document.addEventListener("pointermove", e => {
      if (!arrastre) return;
      if (!arrastre.activo) {
        if (Math.hypot(e.clientX - arrastre.x, e.clientY - arrastre.y) < 7) return;
        arrastre.activo = true;
        document.activeElement?.blur?.();
        arrastre.el.classList.add("arrastrando");
        document.body.classList.add("moviendo");
      }
      getSelection().removeAllRanges();
      arrastre.destino = destino(e);
    });
    addEventListener("pointerup", () => {
      if (!arrastre) return;
      const { activo, destino: d, el } = arrastre;
      arrastre = null;
      marca.style.display = "none";
      el.classList.remove("arrastrando");
      document.body.classList.remove("moviendo");
      if (!activo || !d) return;
      if (d.tipo === "mover" && d.de !== d.a) parentMsg(d);
      if (d.tipo === "seccion") {
        const ids = c => [...document.querySelector(`[data-col="${c}"]`).querySelectorAll(":scope > section[data-drag=sec]")].map(s => s.dataset.id).filter(id => id !== el.dataset.id);
        const orden = { principal: ids("principal"), lateral: ids("lateral") };
        const lista = orden[d.col.dataset.col];
        const i = d.antes ? lista.indexOf(d.antes.dataset.id) : lista.length;
        lista.splice(i, 0, el.dataset.id);
        parentMsg({ tipo: "orden", orden });
      }
    });
    // Evita que el clic que cierra un arrastre active la edición de texto
    document.addEventListener("click", e => { if (document.body.classList.contains("moviendo")) e.preventDefault(); }, true);
    window.addEventListener("message", e => {
      if (e.source !== parent || parent === window) return;
      if (location.protocol !== "file:" && e.origin !== location.origin) return;
      const m = e.data && typeof e.data === "object" ? e.data : {};
      if (m.tipo === "cv") {
        window._idMedida = m.id;
        render(m.cv); activar();
        const f = m.foco && document.querySelector(`[data-p="${m.foco}"]`);
        if (f) { f.focus(); getSelection().selectAllChildren(f); }
      }
      if (m.tipo === "ats" && document.body.classList.contains("ats") !== m.on) { alternarATS(); informar(); }
      if (m.tipo === "imprimir") {
        // Nombre sugerido del PDF: "CV Nombre Apellido"
        const t = document.title; if (typeof m.titulo === "string") document.title = m.titulo.slice(0, 120);
        window.print(); document.title = t;
      }
    });
    parentMsg({ tipo: "listo" });
  }
</script>
</body>
</html>
